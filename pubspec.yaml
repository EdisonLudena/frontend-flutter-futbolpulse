name: futbol_stats
description: "Frontend para Fútbol Stats API"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── Estado ────────────────────────────────────────────────
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # ── Navegación ────────────────────────────────────────────
  go_router: ^17.3.0

  # ── HTTP ─────────────────────────────────────────────────
  dio: ^5.7.0

  # ── Almacenamiento seguro ─────────────────────────────────
  flutter_secure_storage: ^10.3.1

  # ── Imágenes ─────────────────────────────────────────────
  cached_network_image: ^3.4.1

  # ── Modelos / serialización ───────────────────────────────
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # ── Configuración / entorno ───────────────────────────────
  flutter_dotenv: ^6.0.1

  # ── Utilidades ────────────────────────────────────────────
  intl: ^0.20.3
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ── Generadores de código ─────────────────────────────────
  build_runner: ^2.4.13
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - .env
